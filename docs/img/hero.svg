<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="SpiderBridge brings the Spider Farmer GGS controller into Home Assistant: hub with display, smart-cable splitter, lights, fan, sensor, plus a small ESP32 bridge speaking BLE to the controller and MQTT to Home Assistant.">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#181b22"/>
      <stop offset="1" stop-color="#0f1116"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="ledOn" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9af0c4"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="lightCone" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffe89a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffe89a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#41bdf5"/>
    </marker>
    <marker id="arrAcc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#8b93a7"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" rx="28" fill="url(#bg)" stroke="#262b35" stroke-width="2"/>

  <!-- title strip -->
  <g font-family="system-ui,'Segoe UI',Roboto,sans-serif" fill="#f2f4f8">
    <text x="48" y="58" font-size="32" font-weight="700">From tent to Home Assistant — without the cloud</text>
    <text x="48" y="92" font-size="18" fill="#8b93a7">SpiderBridge turns the GGS controller into a native HA device: ~€10 ESP32, 60-second flash, zero app, zero vendor account.</text>
  </g>

  <!-- ===== Grow tent side (left) ===== -->
  <g>
    <!-- tent outline -->
    <path d="M70 200 L320 200 L320 560 L70 560 Z" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
    <text x="195" y="228" font-family="system-ui,sans-serif" font-size="14" fill="#6f7787" text-anchor="middle">your grow tent</text>

    <!-- hanging rail -->
    <line x1="100" y1="262" x2="290" y2="262" stroke="#2c313d" stroke-width="2"/>
    <line x1="170" y1="262" x2="170" y2="280" stroke="#2c313d" stroke-width="1.5"/>
    <line x1="220" y1="262" x2="220" y2="280" stroke="#2c313d" stroke-width="1.5"/>

    <!-- LED light panel -->
    <g>
      <rect x="130" y="282" width="130" height="38" rx="6" fill="#1a1d24" stroke="#41bdf5" stroke-width="2"/>
      <g fill="#ffe89a">
        <circle cx="146" cy="301" r="3"/>
        <circle cx="164" cy="301" r="3"/>
        <circle cx="182" cy="301" r="3"/>
        <circle cx="200" cy="301" r="3"/>
        <circle cx="218" cy="301" r="3"/>
        <circle cx="236" cy="301" r="3"/>
        <circle cx="146" cy="313" r="3"/>
        <circle cx="164" cy="313" r="3"/>
        <circle cx="182" cy="313" r="3"/>
        <circle cx="200" cy="313" r="3"/>
        <circle cx="218" cy="313" r="3"/>
        <circle cx="236" cy="313" r="3"/>
      </g>
      <!-- light cone -->
      <path d="M130 320 L260 320 L320 560 L70 560 Z" fill="url(#lightCone)"/>
      <text x="195" y="358" font-family="system-ui,sans-serif" font-size="14" fill="#8b93a7" text-anchor="middle">LED light</text>
    </g>

    <!-- clip fan -->
    <g>
      <circle cx="95" cy="430" r="22" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
      <circle cx="95" cy="430" r="4" fill="#8b93a7"/>
      <g stroke="#8b93a7" stroke-width="2" fill="none">
        <path d="M95 430 Q108 414 119 426"/>
        <path d="M95 430 Q108 446 119 434"/>
        <path d="M95 430 Q82 414 71 426"/>
        <path d="M95 430 Q82 446 71 434"/>
      </g>
      <text x="95" y="478" font-family="system-ui,sans-serif" font-size="14" fill="#8b93a7" text-anchor="middle">clip fan</text>
    </g>

    <!-- inline exhaust fan (right side of tent) -->
    <g>
      <rect x="278" y="408" width="34" height="80" rx="6" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
      <circle cx="295" cy="448" r="14" fill="none" stroke="#8b93a7" stroke-width="1.5"/>
      <g stroke="#8b93a7" stroke-width="1.5" fill="none">
        <path d="M295 448 L304 440"/>
        <path d="M295 448 L304 456"/>
        <path d="M295 448 L286 440"/>
        <path d="M295 448 L286 456"/>
      </g>
      <text x="295" y="510" font-family="system-ui,sans-serif" font-size="14" fill="#8b93a7" text-anchor="middle">exhaust</text>
    </g>

    <!-- substrate sensor probe (in a pot) -->
    <g transform="translate(150,470)">
      <rect x="0" y="0" width="44" height="40" rx="4" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
      <rect x="6" y="6" width="32" height="14" rx="2" fill="url(#screen)"/>
      <line x1="10" y1="13" x2="32" y2="13" stroke="#4ade80" stroke-width="1.5"/>
      <line x1="22" y1="0" x2="22" y2="-26" stroke="#8b93a7" stroke-width="1.5"/>
      <circle cx="22" cy="-28" r="3" fill="#4ade80"/>
      <text x="22" y="58" font-family="system-ui,sans-serif" font-size="14" fill="#8b93a7" text-anchor="middle">soil sensor</text>
    </g>
  </g>

  <!-- ===== Spider Farmer GGS controller (center) ===== -->
  <g>
    <!-- the hub: rounded box with display -->
    <rect x="430" y="240" width="260" height="180" rx="22" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
    <!-- display -->
    <rect x="450" y="262" width="220" height="86" rx="10" fill="url(#screen)" stroke="#262b35" stroke-width="1.5"/>
    <!-- display readouts -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9af0c4">
      <text x="466" y="288" font-size="14">24.6°C  58% RH</text>
      <text x="466" y="310" font-size="14">CO₂  812 ppm</text>
      <text x="466" y="332" font-size="14">PPFD  720 μmol</text>
    </g>
    <!-- status LED -->
    <circle cx="652" cy="272" r="4" fill="url(#ledOn)"/>
    <!-- brand line + model -->
    <text x="560" y="376" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#f2f4f8">Spider Farmer GGS</text>
    <text x="560" y="398" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#8b93a7">smart grow controller · BLE</text>

    <!-- smart-cable splitter (10 ports) -->
    <g>
      <rect x="430" y="440" width="260" height="78" rx="14" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
      <text x="560" y="464" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#8b93a7">10-port smart-cable splitter</text>
      <g fill="#262b35" stroke="#3a4150" stroke-width="1">
        <circle cx="455" cy="492" r="6"/><circle cx="475" cy="492" r="6"/><circle cx="495" cy="492" r="6"/><circle cx="515" cy="492" r="6"/><circle cx="535" cy="492" r="6"/>
        <circle cx="555" cy="492" r="6"/><circle cx="575" cy="492" r="6"/><circle cx="595" cy="492" r="6"/><circle cx="615" cy="492" r="6"/><circle cx="635" cy="492" r="6"/>
      </g>
      <g fill="#4ade80">
        <circle cx="455" cy="492" r="2.2"/><circle cx="475" cy="492" r="2.2"/><circle cx="495" cy="492" r="2.2"/><circle cx="515" cy="492" r="2.2"/>
        <circle cx="535" cy="492" r="2.2"/><circle cx="555" cy="492" r="2.2"/>
      </g>
    </g>

    <!-- accessory cables into tent -->
    <path d="M445 492 Q380 492 350 480 Q310 464 280 420" fill="none" stroke="#3a4150" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M495 492 Q380 510 200 430" fill="none" stroke="#3a4150" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M535 492 Q420 540 195 470" fill="none" stroke="#3a4150" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M295 488 L295 488" stroke="#3a4150"/>
  </g>

  <!-- ===== SpiderBridge ESP32 (right-center) ===== -->
  <g>
    <rect x="800" y="290" width="200" height="160" rx="20" fill="#1a1d24" stroke="#41bdf5" stroke-width="2.5"/>
    <!-- ESP32 chip illustration -->
    <g transform="translate(844,310)">
      <rect width="112" height="68" rx="8" fill="#0e1217" stroke="#3a4150" stroke-width="1.5"/>
      <rect x="40" y="20" width="32" height="28" rx="2" fill="#1a1d24" stroke="#41bdf5" stroke-width="1.5"/>
      <text x="56" y="38" font-family="ui-monospace,monospace" font-size="9" fill="#8ab4f8" text-anchor="middle">ESP32</text>
      <!-- pin headers -->
      <g fill="#8b93a7">
        <rect x="6" y="6" width="2" height="3"/><rect x="14" y="6" width="2" height="3"/><rect x="22" y="6" width="2" height="3"/><rect x="30" y="6" width="2" height="3"/>
        <rect x="80" y="6" width="2" height="3"/><rect x="88" y="6" width="2" height="3"/><rect x="96" y="6" width="2" height="3"/><rect x="104" y="6" width="2" height="3"/>
        <rect x="6" y="59" width="2" height="3"/><rect x="14" y="59" width="2" height="3"/><rect x="22" y="59" width="2" height="3"/><rect x="30" y="59" width="2" height="3"/>
        <rect x="80" y="59" width="2" height="3"/><rect x="88" y="59" width="2" height="3"/><rect x="96" y="59" width="2" height="3"/><rect x="104" y="59" width="2" height="3"/>
      </g>
      <!-- USB-C -->
      <rect x="-14" y="28" width="14" height="12" rx="2" fill="#2c313d" stroke="#3a4150"/>
    </g>
    <text x="900" y="408" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#8ab4f8">SpiderBridge</text>
    <text x="900" y="432" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#f2f4f8">ESP32 · 4 MB flash · ~€10</text>
  </g>

  <!-- BLE link between controller and bridge -->
  <path d="M690 330 L800 330" fill="none" stroke="#41bdf5" stroke-width="3" marker-end="url(#arr)"/>
  <text x="745" y="318" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#8ab4f8">Bluetooth LE</text>
  <text x="745" y="354" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#6f7787">encrypted · local</text>

  <!-- ===== Home Assistant (right) ===== -->
  <g>
    <rect x="1040" y="270" width="200" height="200" rx="20" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
    <!-- HA logo mark -->
    <circle cx="1140" cy="320" r="20" fill="none" stroke="#41bdf5" stroke-width="3"/>
    <text x="1140" y="326" font-family="system-ui,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#8ab4f8">H</text>
    <text x="1140" y="380" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#f2f4f8">Home Assistant</text>
    <text x="1140" y="404" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#8b93a7">183 native entities</text>
    <text x="1140" y="424" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#8b93a7">MQTT Discovery · LAN</text>
    <!-- entity chip row -->
    <g>
      <rect x="1058" y="438" width="46" height="20" rx="4" fill="#0f1116" stroke="#3a4150"/>
      <text x="1081" y="452" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle" fill="#8ab4f8">light</text>
      <rect x="1108" y="438" width="46" height="20" rx="4" fill="#0f1116" stroke="#3a4150"/>
      <text x="1131" y="452" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle" fill="#8ab4f8">fan</text>
      <rect x="1158" y="438" width="46" height="20" rx="4" fill="#0f1116" stroke="#3a4150"/>
      <text x="1181" y="452" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle" fill="#8ab4f8">sensor</text>
    </g>
  </g>

  <!-- MQTT link between bridge and HA -->
  <path d="M1000 370 L1040 370" fill="none" stroke="#41bdf5" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1020" y="358" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#8ab4f8">MQTT</text>

  <!-- ===== Bottom callouts ===== -->
  <g font-family="system-ui,'Segoe UI',Roboto,sans-serif">
    <g transform="translate(70,580)">
      <rect width="280" height="42" rx="10" fill="#0f1116" stroke="#3a4150"/>
      <text x="16" y="20" font-size="14" font-weight="700" fill="#4ade80">🔒 No cloud</text>
      <text x="16" y="36" font-size="12" fill="#8b93a7">controller cloud link can be off</text>
    </g>
    <g transform="translate(370,580)">
      <rect width="280" height="42" rx="10" fill="#0f1116" stroke="#3a4150"/>
      <text x="16" y="20" font-size="14" font-weight="700" fill="#4ade80">💸 Under €15</text>
      <text x="16" y="36" font-size="12" fill="#8b93a7">ESP32 + USB cable, no Raspberry Pi</text>
    </g>
    <g transform="translate(670,580)">
      <rect width="280" height="42" rx="10" fill="#0f1116" stroke="#3a4150"/>
      <text x="16" y="20" font-size="14" font-weight="700" fill="#4ade80">⚡ 60 s install</text>
      <text x="16" y="36" font-size="12" fill="#8b93a7">browser installer, no terminal, no YAML</text>
    </g>
    <g transform="translate(970,580)">
      <rect width="240" height="42" rx="10" fill="#0f1116" stroke="#3a4150"/>
      <text x="16" y="20" font-size="14" font-weight="700" fill="#4ade80">🧠 1:1 to the app</text>
      <text x="16" y="36" font-size="12" fill="#8b93a7">lights, fans, alarms, plans, calibration</text>
    </g>
  </g>
</svg>
