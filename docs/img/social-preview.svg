    <rect x="752" y="416" width="130" height="64" rx="32" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
    <text x="817" y="457" fill="#8ab4f8">MQTT</text>
    <rect x="894" y="416" width="246" height="64" rx="32" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
    <text x="1017" y="457" fill="#8ab4f8">firmware + web UI</text>
  </g>

  <text x="480" y="560" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#6f7787">github.com/matthias1232/spider-farmer-homeassistant</text>
