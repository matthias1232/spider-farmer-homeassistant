      <rect x="235" y="171" width="140" height="170" rx="18" fill="#1a1d24" stroke="#41bdf5" stroke-width="6"/>
      <rect x="263" y="213" width="84" height="86" rx="10" fill="none" stroke="#41bdf5" stroke-width="4" opacity=".5"/>
      <text x="305" y="268" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#8ab4f8">ESP32</text>
      <g stroke="#41bdf5" stroke-width="5" stroke-linecap="round">
        <path d="M235 186 224 186"/><path d="M235 200 224 200"/><path d="M235 214 224 214"/>
        <path d="M235 228 224 228"/><path d="M235 242 224 242"/><path d="M235 270 224 270"/>
        <path d="M235 284 224 284"/><path d="M235 298 224 298"/><path d="M235 312 224 312"/>
        <path d="M235 326 224 326"/>
        <path d="M375 186 386 186"/><path d="M375 200 386 200"/><path d="M375 214 386 214"/>
        <path d="M375 228 386 228"/><path d="M375 242 386 242"/><path d="M375 270 386 270"/>
        <path d="M375 284 386 284"/><path d="M375 298 386 298"/><path d="M375 312 386 312"/>
        <path d="M375 326 386 326"/>
        <path d="M258 341 258 353"/><path d="M270 341 270 353"/><path d="M282 341 282 353"/>
        <path d="M294 341 294 353"/><path d="M306 341 306 353"/><path d="M318 341 318 353"/>
        <path d="M330 341 330 353"/><path d="M342 341 342 353"/>
