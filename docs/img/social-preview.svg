  <!-- wordmark + tagline -->
  <g font-family="system-ui,'Segoe UI',Roboto,sans-serif">
    <text x="480" y="300" font-size="96" font-weight="600" fill="#f2f4f8">Spider<tspan fill="#8ab4f8">Bridge</tspan></text>
    <text x="484" y="356" font-size="34" fill="#8b93a7">ESP32 bridge for Spider Farmer controllers</text>
  </g>

  <!-- chips -->
  <g font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="22" text-anchor="middle">
    <rect x="480" y="416" width="262" height="64" rx="32" fill="#1a1d24" stroke="#2c313d" stroke-width="2"/>
