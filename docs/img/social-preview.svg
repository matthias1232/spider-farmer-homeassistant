<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="SpiderBridge - ESP32 bridge for Spider Farmer controllers">
  <defs>
    <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13151a"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="spglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#41bdf5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#41bdf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d25"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#spbg)"/>
  <ellipse cx="200" cy="110" rx="560" ry="330" fill="url(#spglow)"/>
  <ellipse cx="1180" cy="560" rx="420" ry="260" fill="#4ade80" opacity=".05"/>

  <!-- mark -->
