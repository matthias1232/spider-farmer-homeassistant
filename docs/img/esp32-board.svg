<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="ESP32-WROOM-32 development board illustration">
  <defs>
    <linearGradient id="spcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18222c"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" rx="28" fill="#13151a" stroke="#262b35" stroke-width="2"/>

  <!-- board -->
  <rect x="170" y="150" width="560" height="330" rx="22" fill="url(#spcb)" stroke="#2c313d" stroke-width="2"/>
  <g fill="#0d0f13" stroke="#2c313d" stroke-width="2">
    <circle cx="196" cy="176" r="10"/>
    <circle cx="704" cy="176" r="10"/>
    <circle cx="196" cy="454" r="10"/>
    <circle cx="704" cy="454" r="10"/>
  </g>

  <!-- ESP32-WROOM-32 shield -->
  <g>
    <rect x="290" y="190" width="320" height="190" rx="10" fill="#2b3341" stroke="#41bdf5" stroke-width="2"/>
    <!-- PCB antenna: vertical hatches under a horizontal bar -->
    <g stroke="#41bdf5" stroke-width="3" stroke-linecap="round">
      <path d="M310 212 L590 212"/>
      <path d="M320 212 L320 240"/><path d="M340 212 L340 240"/><path d="M360 212 L360 240"/>
      <path d="M380 212 L380 240"/><path d="M400 212 L400 240"/><path d="M420 212 L420 240"/>
