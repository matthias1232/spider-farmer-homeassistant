  <text x="450" y="116" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#f2f4f8">One small board</text>
  <text x="450" y="596" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="17" text-anchor="middle" fill="#8b93a7">ESP32-WROOM-32 devkit · flashed over USB-C · runs the bridge firmware</text>
