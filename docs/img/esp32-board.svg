      <path d="M500 212 L500 240"/><path d="M520 212 L520 240"/><path d="M540 212 L540 240"/>
      <path d="M560 212 L560 240"/><path d="M580 212 L580 240"/>
    </g>
    <text x="450" y="318" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#f2f4f8">ESP32-WROOM-32</text>
    <text x="450" y="346" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="16" text-anchor="middle" fill="#8b93a7">Espressif</text>
  </g>

