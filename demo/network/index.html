<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpiderBridge Network</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1rem;background:#13151a;color:#e6e6e6}h1{font-size:1.3rem;margin:0 0 .2rem}p.sub{margin:0 0 1rem;color:#9aa0aa;font-size:.85rem}a{color:#8ab4f8;text-decoration:none}fieldset{border:1px solid #2c303a;border-radius:.5rem;padding:.9rem;margin:0 0 1rem;background:#1a1d24}legend{color:#8ab4f8;font-size:.9rem;padding:0 .4rem}table{width:100%;border-collapse:collapse;font-size:.82rem}th{text-align:left;color:#9aa0aa;font-weight:500;padding:.3rem .4rem;border-bottom:1px solid #2c303a}td{padding:.35rem .4rem;border-bottom:1px solid #22262e;font-family:ui-monospace,monospace}tr:last-child td{border-bottom:0}input,select{padding:.3rem .45rem;background:#0f1116;color:#e6e6e6;border:1px solid #333845;border-radius:.3rem;font-size:.8rem}button{padding:.3rem .7rem;border:1px solid #333845;border-radius:.3rem;background:#1a1d24;color:#c3c8d0;cursor:pointer;font-size:.8rem}button:hover{background:#242832}button.danger{border-color:#7f1d1d;color:#fca5a5}button.go{background:#8ab4f8;color:#13151a;border-color:#8ab4f8;font-weight:600}.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}.on{color:#4ade80}.off{color:#6b7280}.no{color:#f87171}.hint{color:#6b7280;font-size:.75rem;margin-top:.5rem;line-height:1.5}#msg{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#1f2430;border:1px solid #333845;border-radius:.4rem;padding:.5rem .9rem;font-size:.82rem;opacity:0;transition:opacity .2s}#msg.show{opacity:1}.topnav{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;padding:.6rem 0 .9rem;margin-bottom:.8rem;border-bottom:1px solid #2c303a}.topnav a{color:#9aa0aa;text-decoration:none;font-size:.85rem;padding:.2rem 0;border-bottom:2px solid transparent}.topnav a:hover{color:#c3c8d0}.topnav a.cur{color:#8ab4f8;border-bottom-color:#8ab4f8;font-weight:600}.topnav .brand{color:#e6e6e6;font-weight:600;font-size:.95rem;margin-right:.3rem}</style></head><body>
<div id="sbdemo" style="background:#fbbf24;color:#13151a;font:600 .8rem system-ui;
padding:.45rem .8rem;text-align:center">
  DEMO — all data here is simulated. This is the real bridge interface, rendered offline with
  <a href="https://github.com/matthias1232/spider-farmer-homeassistant">SpiderBridge</a>'s
  faker. Built and tested with this
  <a href="https://www.amazon.de/dp/B0DHRV7784?&linkCode=ll2&tag=matthias1232-20&linkId=c71aee711cb280677528abe8e058e53c&ref_=as_li_ss_tl">ESP32 board</a>
  · <a href="https://www.buymeacoffee.com/matthias1232">Donate</a>
</div><div class="topnav"><span class="brand">SpiderBridge</span><a href="../">Settings</a><a href="../control/">Control</a><a href="../status/">Status</a><a href="../network/" class="cur">Network</a><a href="../log/">MQTT log</a><a href="../update/">Firmware</a><a href="../about/">About</a></div><h1>Network</h1><div id="app"><p class="sub">Loading&hellip;</p></div><div id="msg"></div><script>let S={};function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}function toast(t){const m=document.getElementById('msg');m.textContent=t;m.className='show';setTimeout(()=>m.className='',2000);}async function act(f){try{const r=await fetch('/network/act',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(f).toString()});const t=await r.text();toast(t);setTimeout(load,400);}catch(e){toast('Connection failed');}}function render(){let h='';h+='<fieldset><legend>Connected to the hotspot</legend>';if(!S.clients.length){h+='<p class=sub>No clients connected.</p>';}else{h+='<table><tr><th>Name</th><th>MAC</th><th>Address</th><th>Signal</th><th></th></tr>';for(const c of S.clients){h+='<tr><td><input id="n_'+c.mac.replace(/:/g,'')+'" value="'+esc(c.name||'')+'" placeholder="unnamed" size=12></td>'+'<td>'+esc(c.mac)+'</td><td>'+esc(c.ip||'-')+'</td>'+'<td>'+c.rssi+' dBm</td><td>'+'<button onclick="nameIt(\''+c.mac+'\')">Save</button> '+(c.listed?'<button class=danger onclick="act({a:\'mac_del\',mac:\''+c.mac+'\'})">Unlist</button>':'<button onclick="act({a:\'mac_add\',mac:\''+c.mac+'\'})">List</button>')+'</td></tr>';}h+='</table>';}h+='</fieldset>';h+='<fieldset><legend>Who may use the hotspot</legend>';h+='<div class=row><select id=macmode>'+'<option value=0'+(S.mac_mode==0?' selected':'')+'>Open to all</option>'+'<option value=1'+(S.mac_mode==1?' selected':'')+'>Block the listed</option>'+'<option value=2'+(S.mac_mode==2?' selected':'')+'>Allow only the listed</option>'+'</select><button onclick="act({a:\'mac_mode\',v:document.getElementById(\'macmode\').value})">Apply</button></div>';if(S.mac_list.length){h+='<table><tr><th>MAC</th><th>Note</th><th></th></tr>';for(const m of S.mac_list)h+='<tr><td>'+esc(m.mac)+'</td><td>'+esc(m.label||'')+'</td>'+'<td><button class=danger onclick="act({a:\'mac_del\',mac:\''+m.mac+'\'})">Remove</button></td></tr>';h+='</table>';}h+='<div class=row><input id=macnew placeholder="AA:BB:CC:DD:EE:FF" size=18><input id=maclbl placeholder="note" size=12>'+'<button onclick="act({a:\'mac_add\',mac:document.getElementById(\'macnew\').value,label:document.getElementById(\'maclbl\').value})">Add</button></div>';h+='<div class=hint>Allow-only mode refuses to turn on with an empty list, since that would lock out the controller too.</div>';h+='</fieldset>';h+='<fieldset><legend>Who may open this interface</legend>';h+='<div class=row><select id=ipmode>'+'<option value=0'+(S.ip_mode==0?' selected':'')+'>Open to all</option>'+'<option value=1'+(S.ip_mode==1?' selected':'')+'>Block the listed</option>'+'<option value=2'+(S.ip_mode==2?' selected':'')+'>Allow only the listed</option>'+'</select><button onclick="act({a:\'ip_mode\',v:document.getElementById(\'ipmode\').value})">Apply</button></div>';if(S.ip_list.length){h+='<table><tr><th>Range</th><th>Note</th><th></th></tr>';for(let i=0;i<S.ip_list.length;i++)h+='<tr><td>'+esc(S.ip_list[i].cidr)+'</td><td>'+esc(S.ip_list[i].note||'')+'</td>'+'<td><button class=danger onclick="act({a:\'ip_del\',i:'+S.ip_list[i].idx+'})">Remove</button></td></tr>';h+='</table>';}h+='<div class=row><input id=ipnew placeholder="192.168.1.0/24" size=18>'+'<input id=ipnote placeholder="note" size=12>'+'<button onclick="act({a:\'ip_add\',cidr:document.getElementById(\'ipnew\').value,note:document.getElementById(\'ipnote\').value})">Add</button></div>';h+='<div class=hint>Clients on the SpiderBridge hotspot are always allowed, whatever these rules say — so there is always a way back in if a rule turns out to be wrong.</div>';h+='</fieldset>';document.getElementById('app').innerHTML=h;}function nameIt(mac){const el=document.getElementById('n_'+mac.replace(/:/g,''));act({a:'name',mac:mac,name:el.value});}async function load(){const f=document.activeElement;if(f&&f.tagName==='INPUT')return;try{const r=await fetch('/network/data');S=await r.json();render();}catch(e){}}load();setInterval(()=>{if(!document.hidden)load();},5000);</script><script src="../faker.js"></script></body></html>
