<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpiderBridge Control</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:40rem;margin:0 auto;padding:1rem;background:#13151a;color:#e6e6e6}h1{font-size:1.3rem;margin:0 0 .2rem}p.sub{margin:0 0 1rem;color:#9aa0aa;font-size:.85rem}a{color:#8ab4f8;text-decoration:none}fieldset{border:1px solid #2c303a;border-radius:.5rem;padding:.9rem;margin:0 0 1rem;background:#1a1d24}legend{color:#8ab4f8;font-size:.9rem;padding:0 .4rem}.row{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid #22262e;flex-wrap:wrap}.row:last-child{border-bottom:0}.lbl{flex:1;min-width:8rem;font-size:.88rem}.val{color:#9aa0aa;font-size:.82rem;min-width:3.5rem;text-align:right}.now{display:inline-block;min-width:3rem;padding:.1rem .4rem;margin-right:.35rem;border-radius:.3rem;background:#0f2a1a;color:#4ade80;font-size:.8rem;text-align:center;border:1px solid #14532d}button{padding:.35rem .8rem;border:1px solid #333845;border-radius:.3rem;background:#1a1d24;color:#c3c8d0;cursor:pointer;font-size:.82rem}button.on{background:#4ade80;color:#13151a;border-color:#4ade80;font-weight:600}button.off{background:#2c303a;color:#9aa0aa}input[type=range]{flex:1;min-width:7rem;accent-color:#8ab4f8}input[type=text],input[type=number],select{padding:.3rem .5rem;background:#0f1116;color:#e6e6e6;border:1px solid #333845;border-radius:.3rem;font-size:.82rem;width:6.5rem}select{width:auto;max-width:14rem}.tbox{display:inline-flex;align-items:center;gap:.15rem}.tbox select{width:3.4rem;padding:.3rem .2rem;text-align:center}#msg{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#1a1d24;border:1px solid #2c303a;border-radius:.4rem;padding:.5rem 1rem;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none}#msg.show{opacity:1}.none{color:#6b7280;font-size:.85rem;padding:.5rem 0}.sw{position:relative;display:inline-block;width:2.4rem;height:1.3rem;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#333845;border-radius:1rem;cursor:pointer;transition:.15s}.sw span:before{content:'';position:absolute;width:1rem;height:1rem;left:.15rem;top:.15rem;background:#9aa0aa;border-radius:50%;transition:.15s}.sw input:checked+span{background:#8ab4f8}.sw input:checked+span:before{transform:translateX(1.1rem);background:#fff}.sw input:disabled+span{opacity:.4;cursor:not-allowed}.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin:0 0 1rem;border-bottom:1px solid #2c303a;padding-bottom:.5rem}.tab{padding:.4rem .8rem;border:1px solid #333845;border-radius:.3rem .3rem 0 0;background:#1a1d24;color:#9aa0aa;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:.4rem}.tab.sel{background:#8ab4f8;color:#13151a;border-color:#8ab4f8;font-weight:600}.dot{width:.5rem;height:.5rem;border-radius:50%;background:#6b7280;flex-shrink:0}.dot.up{background:#4ade80}.devbar{display:flex;gap:.5rem;align-items:center;margin:0 0 1rem;flex-wrap:wrap;font-size:.82rem;color:#9aa0aa}.devbar input{width:9rem}.devinfo{font-size:.75rem;color:#9ca3af;margin:-.6rem 0 1rem}button.danger{border-color:#7f1d1d;color:#fca5a5}button.danger:hover{background:#7f1d1d;color:#fff}.topnav{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;padding:.6rem 0 .9rem;margin-bottom:.8rem;border-bottom:1px solid #2c303a}.topnav a{color:#9aa0aa;text-decoration:none;font-size:.85rem;padding:.2rem 0;border-bottom:2px solid transparent}.topnav a:hover{color:#c3c8d0}.topnav a.cur{color:#8ab4f8;border-bottom-color:#8ab4f8;font-weight:600}.topnav .brand{color:#e6e6e6;font-weight:600;font-size:.95rem;margin-right:.3rem}</style></head><body>

</div><div class="topnav"><span class="brand">SpiderBridge</span><a href="../">Settings</a><a href="../control/" class="cur">Control</a><a href="../status/">Status</a><a href="../network/">Network</a><a href="../log/">MQTT log</a><a href="../update/">Firmware</a></div><h1>Control</h1><p class="sub">Everything the controller exposes.</p><div id="tabs" class="tabs"></div><div id="app"><div class="none">Loading&hellip;</div></div><div id="msg"></div><script>let S={};let SEL='';function toast(t){const m=document.getElementById('msg');m.textContent=t;m.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>m.className='',t.length>20?6000:1800);}function dev(){return (S.devices||[]).find(d=>d.mac===SEL);}async function send(f,s,v){try{const r=await fetch('/control/set',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'d='+encodeURIComponent(SEL)+'&f='+encodeURIComponent(f)+'&s='+encodeURIComponent(s||'')+'&v='+encodeURIComponent(v)});const t=await r.text();toast(r.ok?(t==='ok'?'Sent':t):'Not sent: '+t);if(!r.ok){for(const e of document.querySelectorAll('[data-hold]'))delete e.dataset.hold;render();}setTimeout(checkVer,300);setTimeout(checkVer,1500);setTimeout(checkVer,4000);}catch(e){toast('Connection lost');}}async function rename(){const d=dev();if(!d)return;const name=document.getElementById('dname').value.trim();const slug=document.getElementById('dslug').value.trim();try{const r=await fetch('/control/device',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'a=rename&d='+encodeURIComponent(d.mac)+'&name='+encodeURIComponent(name)+'&slug='+encodeURIComponent(slug)});const t=await r.text();toast(r.ok?'Renamed':'Failed: '+t);setTimeout(load,600);}catch(e){toast('Connection lost');}}async function unpair(){const d=dev();if(!d)return;if(!confirm('Remove the Bluetooth pairing of '+d.name+'?\n\nThe controller advertises over Bluetooth again, so a phone (Spider Farmer app) can pair with it. Its Wi-Fi settings and its connection to this bridge stay as they are.'))return;send('pairing','','OFF');}async function forget(){const d=dev();if(!d)return;if(!confirm('Remove '+d.name+'? It comes back automatically if that controller reports again.'))return;try{const r=await fetch('/control/device',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'a=forget&d='+encodeURIComponent(d.mac)});await r.text();SEL='';toast('Removed');setTimeout(load,400);}catch(e){toast('Connection lost');}}function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}function nkey(e){if(e.nodeType!==1)return null;if(e.dataset.k)return 'k:'+e.dataset.k;if(e.id)return 'i:'+e.id;if(e.tagName==='FIELDSET'){const l=e.querySelector(':scope>legend');return l?'f:'+l.textContent:null;}if(e.classList.contains('row')||e.classList.contains('r')){const l=e.querySelector(':scope>.lbl');return l?'r:'+l.textContent:null;}return null;}function held(e){if(e.nodeType!==1)return false;if(e.dataset.busy){if(e===document.activeElement)return true;delete e.dataset.busy;}if(e.dataset.hold){if(+e.dataset.hold>Date.now())return true;delete e.dataset.hold;}return false;}const KEEPA=['data-hold','data-busy','data-dirty','data-t0'];function syncAttrs(o,n){for(const a of Array.from(o.attributes)){if(KEEPA.includes(a.name))continue;if(!n.hasAttribute(a.name))o.removeAttribute(a.name);}for(const a of Array.from(n.attributes)){if(o.getAttribute(a.name)!==a.value)o.setAttribute(a.name,a.value);}}function syncVal(o,n){const t=o.tagName;if(t!=='SELECT'&&t!=='INPUT'&&t!=='TEXTAREA')return;const cb=o.type==='checkbox'||o.type==='radio';const nv=cb?n.checked:n.value,ov=cb?o.checked:o.value;if(o.dataset.dirty){if(nv===ov)delete o.dataset.dirty;return;}if(o===document.activeElement&&t!=='SELECT'&&!cb)return;if(nv!==ov){if(cb)o.checked=nv;else o.value=nv;}}function patch(o,n){if(o.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;return;}if(held(o)||o.dataset.own)return;if(o.dataset.frozen&&o.dataset.k===n.dataset.k)return;if(o.dataset.s!==n.dataset.s)delete o.dataset.t0;syncAttrs(o,n);morph(o,n);syncVal(o,n);}function morph(o,n){if(o.tagName==='SELECT'){if(o.innerHTML!==n.innerHTML){const v=o.value;o.innerHTML=n.innerHTML;if(o.dataset.dirty&&[...o.options].some(x=>x.value===v))o.value=v;}return;}const map=new Map();for(const c of Array.from(o.childNodes)){const k=nkey(c);if(k){if(!map.has(k))map.set(k,[]);map.get(k).push(c);}}const used=new Set();let i=0;for(const c of Array.from(n.childNodes)){const k=nkey(c);let m=null;if(k){const q=map.get(k);while(q&&q.length){const x=q.shift();if(!used.has(x)){m=x;break;}}}else{const cur=o.childNodes[i];if(cur&&!used.has(cur)&&!nkey(cur)&&cur.nodeName===c.nodeName)m=cur;}if(m&&m.nodeName!==c.nodeName)m=null;if(m){used.add(m);if(o.childNodes[i]!==m)o.insertBefore(m,o.childNodes[i]||null);patch(m,c);}else{o.insertBefore(c,o.childNodes[i]||null);used.add(c);}i++;}while(o.childNodes.length>i)o.removeChild(o.lastChild);}function morphHTML(el,h){const t=document.createElement(el.tagName);t.innerHTML=h;morph(el,t);}document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('select,input[type=range]');if(t)t.dataset.busy=1;},true);document.addEventListener('focusout',e=>{const t=e.target;if(t&&t.dataset)delete t.dataset.busy;},true);document.addEventListener('keyup',e=>{const a=document.activeElement;if(e.key==='Escape'&&a&&a.dataset)delete a.dataset.busy;});document.addEventListener('change',e=>{const t=e.target;if(!t||!t.dataset)return;delete t.dataset.busy;if(t.hasAttribute('onchange')){t.dataset.hold=Date.now()+6000;setTimeout(render,6200);}else t.dataset.dirty=1;},true);document.addEventListener('input',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='text')t.dataset.dirty=1;},true);document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button.on,button.off');if(!b||!/^(ON|OFF)$/.test(b.textContent))return;const on=b.classList.contains('on');b.classList.toggle('on',!on);b.classList.toggle('off',on);b.textContent=on?'OFF':'ON';const oc=b.getAttribute('onclick');if(oc)b.setAttribute('onclick',oc.replace(/(ON|OFF)'\)/,m=>m.indexOf('ON')===0?'OFF'+m.slice(2):'ON'+m.slice(3)));b.dataset.hold=Date.now()+6000;setTimeout(render,6200);});function toggle(f,cur){return '<button class="'+(cur?'on':'off')+'" '+'onclick="send(\''+f+'\',\'\',\''+(cur?'OFF':'ON')+'\')">'+(cur?'ON':'OFF')+'</button>';}function slider(f,sub,v,min,max){return now(v)+'<input type=range min='+min+' max='+max+' value='+v+' '+'oninput="this.nextElementSibling.textContent=this.value" '+'onchange="send(\''+f+'\',\''+sub+'\',this.value)">'+'<span class=val>'+v+'</span>';}function clock(f,sub,val,withSec){const p=String(val||'00:00').split(':');const H=p[0]||'00',M=p[1]||'00',S=p[2]||'00';const id='c'+f+'_'+sub;const pad=n=>String(n).padStart(2,'0');const hh=Array.from({length:24},(_,i)=>pad(i));const mm=Array.from({length:60},(_,i)=>pad(i));const qs=(c,o)=>'<select onchange="sendClock(\''+id+'\')">'+o.map(v=>'<option'+(v===c?' selected':'')+'>'+v+'</option>').join('')+'</select>';let x='<span class=clock id='+id+' data-f='+f+' data-s='+sub+' data-sec='+(withSec?1:0)+'>';x+=now(val||'00:00')+' ';x+=qs(H,hh)+':'+qs(M,mm);if(withSec)x+=':'+qs(S,mm);return x+'</span>';}async function sendClock(id){const wrap=document.getElementById(id);if(!wrap)return;const b=wrap.querySelectorAll('select');if(b.length<2)return;let v=b[0].value+':'+b[1].value;if(wrap.dataset.sec==='1')v+=':'+(b[2]?b[2].value:'00');for(const s of b)s.dataset.hold=Date.now()+6000;await send(wrap.dataset.f,wrap.dataset.s,v);}function now(v){return (v===undefined||v===null||v==='')?'':'<span class=now title="Active now (controller / MQTT)">'+esc(v)+'</span>';}function sel(f,sub,cur,opts){let h=now(cur)+'<select onchange="send(\''+f+'\',\''+sub+'\',this.value)">';for(const o of opts)h+='<option'+(String(o)===String(cur)?' selected':'')+'>'+esc(o)+'</option>';return h+'</select>';}function selRange(f,sub,cur,lo,hi,step){step=step||1;const dp=step<1?String(step).split('.')[1].length:0;const fmt=v=>(Math.round(v*Math.pow(10,dp))/Math.pow(10,dp)).toFixed(dp);let opts=[];const n=Math.round((hi-lo)/step);for(let i=0;i<=n;i++)opts.push(fmt(lo+i*step));if(cur===undefined||cur===null)return sel(f,sub,'',opts);let c=typeof cur==='number'?fmt(cur):String(cur);if(opts.indexOf(c)<0){opts.push(c);opts.sort((a,b)=>parseFloat(a)-parseFloat(b));}return sel(f,sub,c,opts);}function selOpts(f,sub,cur,named,lo,hi){let opts=named.slice();for(let v=lo;v<=hi;v++)opts.push(String(v));if(cur===undefined||cur===null)return sel(f,sub,'',opts);let c=(cur===0)?named[0]:String(cur);if(opts.indexOf(c)<0){opts.push(c);opts.sort((a,b)=>parseFloat(a)-parseFloat(b));}return sel(f,sub,c,opts);}function pickNum(cur,lo,hi,step,id){step=step||1;let opts=[];for(let v=lo;v<=hi;v+=step)opts.push(String(v));let n=parseFloat(cur);if(isNaN(n))n=lo;n=Math.min(hi,Math.max(lo,Math.round((n-lo)/step)*step+lo));const c=String(n);let h=now(cur===undefined?'':c)+'<select id='+id+'>';for(const o of opts)h+='<option'+(o===c?' selected':'')+'>'+esc(o)+'</option>';return h+'</select>';}function row(l,ctrl){const m=/^<button class="(?:on|off)"[^>]*>(ON|OFF|--)</.exec(ctrl);return '<div class=row><span class=lbl>'+l+'</span>'+(m?now(m[1]):'')+ctrl+'</div>';}const FANMODES=['Manual','Schedule','Cycle','Environment: Prioritize temperature','Environment: Prioritize humidity','Environment: Temperature only','Environment: Humidity only','Environment: Temperature & humidity'];const LIGHTMODES=['Manual','Schedule','PPFD'];FANPCT={fan:[1,10],blower:[25,100]};function fanBlock(D,key,title){const b=D[key];if(!b)return '';const p=FANPCT[key];let opts=[];for(let v=p[0];v<=p[1];v++)opts.push(String(v));const sopts=['Auto'].concat(opts);const envm=String(b.mode_label||'').indexOf('Environment')===0;const manual=!b.mode_label||b.mode_label==='Manual';let h='<fieldset><legend>'+title+'</legend>';h+=row('Power',toggle(key,b.on));h+=row('Speed',manual?sel(key,'percentage',b.level,opts):now(b.level+(key==='blower'?' %':''))+'<span class=none>read-only outside Manual mode</span>');h+=row('Mode',sel(key,'preset_mode',b.mode_label,FANMODES));if(key==='fan')h+=row('Oscillation','<button class="'+(b.shake>0?'on':'off')+'" '+'onclick="send(\''+key+'\',\'oscillation\',\''+(b.shake>0?'OFF':'ON')+'\')">'+(b.shake>0?'ON':'OFF')+'</button>');if(key==='fan')h+=row('Oscillation level',selRange(key,'oscillation_level',b.shake>0?b.shake:(b.shake_last||5),1,10,1));if(key==='fan')h+=row('Natural wind','<button class="'+(b.natural?'on':'off')+'" '+'onclick="send(\''+key+'\',\'natural_wind\',\''+(b.natural?'OFF':'ON')+'\')">'+(b.natural?'ON':'OFF')+'</button>');if(key==='blower')h+=row('Close CO2 while blower runs','<button class="'+(b.co2===undefined?'off':(b.co2?'on':'off'))+'" '+'onclick="send(\''+key+'\',\'close_co2\',\''+(b.co2?'OFF':'ON')+'\')">'+(b.co2===undefined?'--':(b.co2?'ON':'OFF'))+'</button>');h+=row('Schedule speed',sel(key,'schedule_speed',b.maxSpeed,envm||b.maxSpeed==='Auto'?sopts:sopts.slice(1))+(envm?'':(b.maxSpeed==='Auto'?'<span class=none style="color:#fbbf24">Auto is not valid outside Environment mode -- pick a speed</span>':'<span class=none>Auto only in Environment mode</span>')));h+=row('Standby speed',key==='fan'?now('Off')+'<span class=none>always 0</span>':sel(key,'standby_speed',b.minSpeed,['Off'].concat(Array.from({length:15},(_,i)=>String(25+i)))));h+=row('Schedule start',clock(key,'schedule_start',b.sched_start,0));h+=row('Schedule end',clock(key,'schedule_end',b.sched_end,0));h+=row('Cycle start',clock(key,'cycle_start',b.cyc_start,0));h+=row('Cycle run',clock(key,'cycle_run_time',b.cyc_run_t,1));h+=row('Cycle off',clock(key,'cycle_off_time',b.cyc_off_t,1));h+=row('Cycle repeats',selRange(key,'cycle_times',b.cyc_times,1,100));return h+'</fieldset>';}function lightBlock(D,key,title){const b=D[key];if(!b)return '';let h='<fieldset><legend>
