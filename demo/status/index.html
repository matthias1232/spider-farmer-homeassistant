<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpiderBridge Status</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1rem;background:#13151a;color:#e6e6e6}h1{font-size:1.3rem;margin:0 0 .2rem}p.sub{margin:0 0 1rem;color:#9aa0aa;font-size:.85rem}a{color:#8ab4f8;text-decoration:none}fieldset{border:1px solid #2c303a;border-radius:.5rem;padding:.9rem;margin:0 0 1rem;background:#1a1d24}legend{color:#8ab4f8;font-size:.9rem;padding:0 .4rem}.row{display:flex;gap:.6rem;padding:.3rem 0;font-size:.85rem;border-bottom:1px solid #22262e;flex-wrap:wrap;align-items:center}.row:last-child{border-bottom:0}.lbl{flex:1;min-width:10rem;color:#9aa0aa}.v{font-family:ui-monospace,monospace;font-size:.82rem}.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}.bar{width:7rem;height:.45rem;background:#2c303a;border-radius:.25rem;overflow:hidden}.bar i{display:block;height:100%;background:#4ade80}.sw{position:relative;display:inline-block;width:2.4rem;height:1.3rem}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#333845;border-radius:1rem;cursor:pointer;transition:.15s}.sw span:before{content:'';position:absolute;width:1rem;height:1rem;left:.15rem;top:.15rem;background:#9aa0aa;border-radius:50%;transition:.15s}.sw input:checked+span{background:#8ab4f8}.sw input:checked+span:before{transform:translateX(1.1rem);background:#fff}.sw input:disabled+span{opacity:.4;cursor:not-allowed}#log{background:#0f1116;border:1px solid #2c303a;border-radius:.4rem;padding:.6rem;font-family:ui-monospace,monospace;font-size:.75rem;line-height:1.45;height:22rem;overflow-y:auto;white-space:pre-wrap;word-break:break-word}.t{color:#6b7280}.topnav{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;padding:.6rem 0 .9rem;margin-bottom:.8rem;border-bottom:1px solid #2c303a}.topnav a{color:#9aa0aa;text-decoration:none;font-size:.85rem;padding:.2rem 0;border-bottom:2px solid transparent}.topnav a:hover{color:#c3c8d0}.topnav a.cur{color:#8ab4f8;border-bottom-color:#8ab4f8;font-weight:600}.topnav .brand{color:#e6e6e6;font-weight:600;font-size:.95rem;margin-right:.3rem}</style></head><body>
<div id="sbdemo" style="background:#fbbf24;color:#13151a;font:600 .8rem system-ui;
padding:.45rem .8rem;text-align:center">
  DEMO — all data here is simulated. This is the real bridge interface, rendered offline with
  <a href="https://github.com/matthias1232/spider-farmer-homeassistant">SpiderBridge</a>'s
  faker. Built and tested with this
  <a href="https://www.amazon.de/dp/B0DHRV7784?&linkCode=ll2&tag=matthias1232-20&linkId=c71aee711cb280677528abe8e058e53c&ref_=as_li_ss_tl">ESP32 board</a>
  · <a href="https://www.buymeacoffee.com/matthias1232">Donate</a>
</div><div class="topnav"><span class="brand">SpiderBridge</span><a href="../">Settings</a><a href="../control/">Control</a><a href="../status/" class="cur">Status</a><a href="../network/">Network</a><a href="../log/">MQTT log</a><a href="../update/">Firmware</a><a href="../about/">About</a></div><h1>Status</h1><div id="app"><div class="sub">Loading&hellip;</div></div><fieldset><legend>System log</legend><div id="log">Loading&hellip;</div></fieldset><script>function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}function row(l,v,cls){return '<div class=row><span class=lbl>'+l+'</span>'+'<span class="v '+(cls||'')+'">'+esc(v)+'</span></div>';}function dur(s){if(s<90)return s+'s';if(s<5400)return Math.floor(s/60)+'m';if(s<172800)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}function render(S){let h='';const w=S.wifi;h+='<fieldset><legend>Uplink</legend>';if(!w.sta_enabled){h+=row('State','No home network configured','warn');}else if(w.sta_has_ip){h+=row('State','Connected','ok');h+=row('Network',w.ssid);h+=row('Access point',w.bssid+'  ch '+w.channel);h+='<div class=row><span class=lbl>Signal</span>'+'<span class="v '+(w.quality>60?'ok':w.quality>30?'warn':'bad')+'">'+w.rssi+' dBm ('+w.quality+'%)</span>'+'<span class=bar><i style="width:'+w.quality+'%"></i></span></div>';h+=row('IP address',w.ip);h+=row('Netmask',w.netmask);h+=row('Gateway',w.gateway);h+=row('DNS',w.dns);}else{h+=row('State','Not connected','bad');h+=row('Configured network',w.ssid||'(set in Settings)');}if(w.disconnects)h+=row('Drops since boot',w.disconnects,w.disconnects>5?'warn':'');h+='</fieldset>';h+='<fieldset><legend>Hotspot</legend>';h+=row('Network',w.ap_ssid);h+=row('Address',w.ap_ip);if(w.ap_subnet)h+=row('Subnet',w.ap_subnet);h+=row('Channel',w.ap_channel+(w.sta_has_ip&&w.channel===w.ap_channel?' (shared with the uplink)':''));h+=row('MAC',w.ap_mac);h+=row('Clients connected',w.ap_clients,w.ap_clients?'ok':'');h+=row('Internet for clients',S.wan?'On':'Off',S.wan?'ok':'warn');h+='</fieldset>';const m=S.mqtt;h+='<fieldset><legend>MQTT broker</legend>';if(!m.configured){h+=row('State','No broker configured','warn');}else{h+=row('State',m.connected?'Connected':'Not connected',m.connected?'ok':'bad');h+=row('Broker',m.broker);if(m.connected)h+=row('Connected for',dur(m.uptime_s));h+=row('Messages sent',m.publishes);if(m.disconnects)h+=row('Drops since boot',m.disconnects,m.disconnects>5?'warn':'');if(m.last_error)h+=row('Last error',m.last_error,'bad');}h+='</fieldset>';const sl=S.syslog;if(sl){h+='<fieldset><legend>Syslog server</legend>';if(!sl.enabled){h+=row('State','Not configured','');}else{const pn=['UDP','TCP','TLS'][sl.proto]||'?';h+=row('State',sl.proto===0?(sl.connected?'Sending':'Not sending'):(sl.connected?'Connected':'Not connected'),sl.connected?'ok':'bad');h+=row('Server',sl.host+':'+sl.port+' ('+pn+')');h+=row('Lines sent',sl.sent);if(sl.dropped)h+=row('Lines dropped',sl.dropped,'warn');if(sl.proto&&sl.reconnects>1)h+=row('Reconnects',sl.reconnects-1,sl.reconnects>6?'warn':'');if(sl.last_error)h+=row('Last error',sl.last_error,'bad');}h+='</fieldset>';}h+='<fieldset><legend>Controllers</legend>';if(!S.devices.length){h+=row('None known yet','A controller appears once it connects','warn');}else{for(const d of S.devices){let note=d.online?'Connected':'Not connected';if(d.online&&d.keepalive_s)note+='  last heard '+d.silence_s+'s ago, keepalive '+d.keepalive_s+'s';else if(d.online&&d.silence_s!==undefined)note+='  last heard '+d.silence_s+'s ago';h+=row(d.name,note+'  '+d.mac,d.online?'ok':'');}}h+='</fieldset>';const t=S.time;h+='<fieldset><legend>Clock</legend>';h+=row('Local time',t.now,t.synced?'ok':'warn');h+=row('Synchronised',t.synced?'Yes':'Not yet',t.synced?'ok':'warn');h+=row('Time zone',t.name||t.zone);h+=row('Rules',t.zone);h+=row('In force',t.abbrev+'  UTC'+(t.utc_offset_min<0?'-':'+')+Math.floor(Math.abs(t.utc_offset_min)/60)+':'+String(Math.abs(t.utc_offset_min)%60).padStart(2,'0')+(t.is_dst?'  (daylight saving)':''));h+=row('NTP server',t.server);h+='<div class=row><span class=lbl>Summer time</span>'+'<label class=sw><input type=checkbox id=dstsw '+(t.dst_mode==2?'checked ':'')+(t.dst_mode==0?'disabled ':'')+'onchange="setDst()"><span></span></label>'+'<span class="v '+(t.dst_mode==0?'':'ok')+'">'+(t.dst_mode==0?'decided by the zone rules':(t.dst_mode==2?'forced on':'forced off'))+'</span></div>';h+='<div class=row><span class=lbl>Follow the zone rules</span>'+'<label class=sw><input type=checkbox id=dstauto '+(t.dst_mode==0?'checked ':'')+'onchange="setAuto()"><span></span></label><span class=v>automatic</span></div>';if(S.tz_push)h+='<div class=row><span class=lbl></span><span class="v ok">Every controller follows these settings</span></div>';h+='</fieldset>';const f=S.fw;h+='<fieldset><legend>Firmware</legend>';h+=row('Version',f.version);h+=row('Built',f.built);h+=row('Running slot',f.slot);if(f.ota_url){h+=row('Update check',f.ota_checked?(f.ota_available?'Newer version available: '+f.ota_remote:'Up to date'):'Not run yet',f.ota_available?'warn':'ok');h+=row('Last checked',f.ota_last);if(f.ota_error)h+=row('Check error',f.ota_error,'bad');}h+='</fieldset>';h+='<fieldset><legend>Device</legend>';h+=row('Uptime',dur(S.uptime_s));h+=row('Free memory',Math.round(S.heap_free/1024)+' KB',S.heap_free<40000?'warn':'');h+=row('Lowest ever',Math.round(S.heap_min/1024)+' KB',S.heap_min<25000?'warn':'');h+=row('Restart reason',S.reset_reason);if(S.boots!==undefined)h+=row('Starts / crashes',S.boots+' / '+S.crashes,S.crashes>0?'warn':'');if(S.crash_streak>0)h+=row('Restarts without a healthy run',S.crash_streak+' of 3','warn');if(S.sv_why)h+=row('Last self-restart',['','a task stopped responding','memory ran low','Bluetooth step stalled','requested','uplink was down'][S.sv_why]+(S.sv_task?' ('+S.sv_task+')':''),'warn');if(S.safe_mode)h+=row('Mode','SAFE MODE: the last starts ended in a crash. Only hotspot, web interface and USB run. Update the firmware or restart from here.','bad');h+='</fieldset>';if(S.ble){const b=S.ble;h+='<fieldset><legend>Bluetooth</legend>';if(b.pending)h+=row('State','Restarting into the Bluetooth-only boot','warn');else if(b.released)h+=row('State','Off (memory released to the system)','ok');else h+=row('State','Memory not released','bad');if(b.last)h+=row('Last job',b.last);h+='<div class=row><small>Bluetooth never runs during normal operation: its memory is '+'needed for the controllers\' encrypted connections. Scanning or setting up a controller '+'(Settings) restarts the bridge into a short Bluetooth-only boot, which does the job and '+'restarts straight back with Bluetooth off.</small></div>';h+='</fieldset>';}document.getElementById('app').innerHTML=h;}async function setMode(m){try{await fetch('/status/dst',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'mode='+m});setTimeout(load,500);}catch(e){}}function setDst(){setMode(document.getElementById('dstsw').checked?2:1);}function setAuto(){if(document.getElementById('dstauto').checked)setMode(0);else setMode(document.getElementById('dstsw').checked?2:1);}let swait=3000;async function load(){if(document.hidden){setTimeout(load,3000);return;}try{const r=await fetch('/status/data');if(r.status===503){setTimeout(load,1500);return;}const j=await r.json();if(j.busy){swait=Math.min(swait*2,20000);}else{swait=3000;render(j);}}catch(e){swait=Math.min(swait*2,20000);}setTimeout(load,swait);}let seq=0,atEnd=true;const lg=document.getElementById('log');lg.addEventListener('scroll',()=>{atEnd=lg.scrollTop+lg.clientHeight>=lg.scrollHeight-30;});let lwait=2500;async function loadLog(){if(document.hidden){setTimeout(loadLog,3000);return;}try{const r=await fetch('/syslog/data?after='+seq);const j=await r.json();if(j.busy){lwait=Math.min(lwait*2,20000);setTimeout(loadLog,lwait);return;}lwait=2500;if(seq===0)lg.textContent='';for(const e of j.lines){const d=document.createElement('div');const s=document.createElement('span');s.className='t';s.textContent='['+(e.ms/1000).toFixed(1)+'] ';d.appendChild(s);d.appendChild(document.createTextNode(e.text));lg.appendChild(d);seq=e.seq;}while(lg.childNodes.length>400)lg.removeChild(lg.firstChild);if(atEnd)lg.scrollTop=lg.scrollHeight;}catch(e){lwait=Math.min(lwait*2,20000);}setTimeout(loadLog,lwait);}load();loadLog();</script><script src="../faker.js"></script></body></html>
