name: Build firmware

# Builds every firmware listed in firmware.json for every listed target,
# produces flashable factory images, uploads them as workflow artifacts,
# publishes the installer + demo pages to GitHub Pages and — for version
# tags — attaches the same images to a downloadable GitHub Release.
#
# A new build is available:
#   - automatically on every push to main (and on every tag v*)
#   - on demand via the Actions tab -> "Run workflow"
#   - for pull requests as validation (no Pages deploy)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Host tests: the Improv serial handlers (installer protocol, including the
  # quick-connect and hotspot-password commands) are compiled for the PC and run
  # against byte-exact packets; the installer's JavaScript is then tested against
  # the replies the firmware code really produced. No board or ESP-IDF needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Firmware protocol tests (host)
        run: python3 firmware/ggs/host_test/run.py
      - name: Installer protocol tests
        run: |
          node --check installer/overlay.js
          node --check installer/quickconnect.js
          node --check installer/console.js
          node --check installer/ggs.js
          node tests/installer_quickconnect.test.mjs
          node tests/installer_console.test.mjs
          node tests/installer_ggs.test.mjs

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(jq -c '
            [ .[] as $f
              | $f.targets[]
              | {
                  firmware: $f.id,
                  name: $f.name,
                  dir: $f.dir,
                  project: $f.project_name,
                  target: .,
                  family: (if . == "esp32" then "ESP32"
                           elif . == "esp32s2" then "ESP32-S2"
                           elif . == "esp32s3" then "ESP32-S3"
                           elif . == "esp32c3" then "ESP32-C3"
                           elif . == "esp32c6" then "ESP32-C6"
                           else error("unknown target " + .) end),
                  flash_size: (if . == "esp32" then "4MB" else "8MB" end),
                  bootloader_offset: (if . == "esp32" then "0x1000" else "0x0" end)
                }
            ]' firmware.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $matrix"

  build:
    needs: [discover, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Firmware version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.firmware }} (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Pinned to the toolchain the local builds use. v5.5 produced an
          # app image roughly 5 KB larger, which then did not fit the OTA
          # partition on already-flashed devices (old 0x180000 table).
          esp_idf_version: v5.3.2
          target: ${{ matrix.target }}
          path: ${{ matrix.dir }}
          command: idf.py -DPROJECT_VER='${{ steps.ver.outputs.version }}' build

      - name: Merge flashable image
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v5.3.2 \
            bash -lc "esptool.py --chip ${{ matrix.target }} merge_bin \
              -o dist/spiderbridge-${{ matrix.firmware }}-${{ matrix.target }}-factory.bin \
              --flash_mode dio --flash_size ${{ matrix.flash_size }} \
              ${{ matrix.bootloader_offset }} build/bootloader/bootloader.bin \
              0x8000  build/partition_table/partition-table.bin \
              0xf000  build/ota_data_initial.bin \
              0x20000 build/${{ matrix.project }}.bin"

      # The factory image is for the USB/web installer and carries the
      # partition table. The bare app image is what http://<bridge>/update
      # takes over WLAN, so it goes into the same artifact instead of
      # having to be carved out of the factory image by hand.
      - name: Add the over-the-air image
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: cp "build/${{ matrix.project }}.bin" "dist/${{ matrix.project }}.bin"

      - name: Write installer manifest
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          cat > "dist/manifest-${{ matrix.firmware }}-${{ matrix.target }}.json" <<EOF
          {
            "name": "SpiderBridge ${{ matrix.name }}",
            "version": "${{ steps.ver.outputs.version }}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "${{ matrix.family }}",
                "parts": [
                  { "path": "spiderbridge-${{ matrix.firmware }}-${{ matrix.target }}-factory.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
          ls -lh dist

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.firmware }}-${{ matrix.target }}
          path: ${{ matrix.dir }}/dist/
          retention-days: 90

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the site
        run: |
          set -euo pipefail
          # docs/ is the landing page: docs/index.html becomes the Pages root
          # and everything under docs/img/ is served from /img/.
          mkdir -p site
          cp -r docs/. site/
          cp -r installer/. site/installer/
          cp -r demo/. site/demo/
          find artifacts -type f \( -name '*.bin' -o -name '*.json' \) \
            -exec cp {} site/ \;
          # Module list for the installer's select box (modules.json) and one
          # auto-detect manifest per firmware (manifest-<firmware>.json). Only
          # targets whose image really was built are offered.
          python3 scripts/gen_installer_manifests.py site
          # Without a root index the whole site 404s, so fail loudly here.
          test -f site/index.html
          test -f site/modules.json
          ls -lh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # A downloadable GitHub Release next to the web installer: the same flashable
  # factory image (it carries the partition table, so it is complete on its own)
  # and the bare application image (what http://<bridge>/update takes over WLAN),
  # attached to the version tag so they can be fetched with a browser, curl or
  # wget, flashed from a local copy of the installer, or archived by hand.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sort the images for download
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF#refs/tags/v}"
          mkdir -p release
          # One artifact per build: artifacts/firmware-<id>-<target>/
          for d in artifacts/*/; do
            [ -d "$d" ] || continue
            prefix=""
            # Factory image for the installer (0x0, with the partition table).
            for f in "$d"*-factory.bin; do
              [ -e "$f" ] || continue
              base="$(basename "$f" .bin)"
              prefix="${base%-factory}"
              cp "$f" "release/${base}-v${ver}.bin"
            done
            [ -n "$prefix" ] || prefix="$(basename "$d")"
            # Bare application image, for /update over WLAN.
            for f in "$d"*.bin; do
              [ -e "$f" ] || continue
              case "$f" in *-factory.bin) continue ;; esac
              cp "$f" "release/${prefix}-app-v${ver}.bin"
            done
            # ESP Web Tools manifest, so the same build can also be flashed
            # from a checkout or a downloaded copy of the installer page.
            for f in "$d"manifest-*.json; do
              [ -e "$f" ] || continue
              # The manifest points at the factory image; keep that reference
              # valid although the released file carries the version in its name.
              sed "s/\.bin\"/-v${ver}.bin\"/g" "$f" \
                > "release/$(basename "$f" .json)-v${ver}.json"
            done
          done
          ls -lh release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
